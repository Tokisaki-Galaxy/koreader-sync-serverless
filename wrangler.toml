name = "koreader-sync"
main = "src/index.ts"
compatibility_date = "2026-03-25"

[vars]
SESSION_TTL_HOURS = "168"

# Resolve sql.js assets as inline modules so the client-side exporter
# can load them from the same origin (no external CDN, locked-down CSP).
[[rules]]
type = "Text"
globs = ["**/sql.js/dist/sql-wasm.js"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/sql.js/dist/sql-wasm.wasm"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "koreader-sync-db"
database_id = "d31acddc-2d87-4743-9531-5396673d8c9a"
migrations_dir = "migrations"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
